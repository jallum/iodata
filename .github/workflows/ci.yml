name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  MIX_ENV: test
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  unit-test:
    name: Test on OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported toolchain (mix.exs requires ~> 1.17)
          - elixir: "1.17.3"
            otp: "27.3"
          - elixir: "1.19.5"
            otp: "28.3"
          # Newest toolchain; the lint cell runs the version-independent
          # checks once. Exactly one cell reports coverage: coveralls closes
          # a PR's build on the first non-parallel upload, so a second
          # reporting cell would 422 whenever finish times diverge.
          - elixir: "1.20.3"
            otp: "29.0"
            coverage: true
            lint: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Restore deps and _build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Check unused dependencies
        if: matrix.lint
        run: mix deps.unlock --check-unused
      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted
      - name: Compile without warnings
        run: mix compile --warnings-as-errors
      - name: Run tests
        run: ${{ matrix.coverage && 'mix coveralls.github' || 'mix test' }}
